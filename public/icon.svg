<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18231C" />
      <stop offset="70%" stop-color="#0B0D0C" />
      <stop offset="100%" stop-color="#050605" />
    </radialGradient>

    <!-- Turf / Pitch Arc Gradient -->
    <linearGradient id="turfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Ball Shading -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>
  </defs>

  <!-- Deep Stadium Night Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />

  <!-- Subtle Pitch Arc lines in Background -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#22C55E" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="235" fill="none" stroke="#22C55E" stroke-opacity="0.08" stroke-width="2" />

  <!-- Outer Neon Tactical Halo -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#turfAccent)" stroke-width="8" stroke-linecap="round" />

  <!-- Football Core (Inside Safe Zone: Centered within 70% bounds) -->
  <g transform="translate(256, 256)">
    <!-- Ball Base Drop Shadow -->
    <circle cx="0" cy="10" r="122" fill="#000000" opacity="0.45" />

    <!-- Ball Base Sphere -->
    <circle cx="0" cy="0" r="120" fill="url(#ballShade)" stroke="#212823" stroke-width="4" />

    <!-- Classic Football Pentagons & Seams (SVG Vectorized Geometry) -->
    <!-- Center Pentagon -->
    <polygon points="0,-42 38,-14 24,34 -24,34 -38,-14" fill="#131815" />

    <!-- Top Pentagon Edge Connection -->
    <polygon points="0,-42 0,-92 36,-114 62,-78 38,-14" fill="#0B0D0C" opacity="0.9" />
    <polygon points="0,-42 0,-92 -36,-114 -62,-78 -38,-14" fill="#0B0D0C" opacity="0.9" />

    <!-- Bottom Left & Right Connection Pentagons -->
    <polygon points="24,34 58,58 48,102 6,108 -24,34" fill="#131815" />
    <polygon points="-24,34 -58,58 -48,102 -6,108 24,34" fill="#0B0D0C" opacity="0.85" />
    <polygon points="38,-14 80,-10 98,30 58,58 24,34" fill="#131815" />
    <polygon points="-38,-14 -80,-10 -98,30 -58,58 -24,34" fill="#131815" />

    <!-- Stylized Mystery / Question Silhouette Overlay (Golden Accent) -->
    <circle cx="36" cy="-38" r="16" fill="#F59E0B" opacity="0.95" />
    <path d="M 36 -32 Q 44 -18 36 -6 Q 30 2 36 10" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    <circle cx="36" cy="22" r="3.5" fill="#F59E0B" />
  </g>
</svg>
